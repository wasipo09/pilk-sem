sample_size: 400
latents:
  SubjectiveNorm: [sn1, sn2]
  Image: [img1, img2, img3]
  JobRelevance: [jr1, jr2, jr3]
  OutputQuality: [oq1, oq2]
  ResultDem: [rd1, rd2]
  PU: [pu1, pu2, pu3, pu4]
  PEU: [peu1, peu2, peu3]
  Intention: [bi1, bi2, bi3]
  Usage: [use1, use2]
paths:
  # Determinants of PU
  - SubjectiveNorm -> PU (sig)
  - Image -> PU (sig)
  - JobRelevance -> PU (sig)
  - OutputQuality -> PU (sig)
  - ResultDem -> PU (sig)
  
  # Determinants of PEU
  # (simplified TAM2)
  
  # Core TAM
  - PEU -> PU (sig)
  - PU -> Intention (sig)
  - PEU -> Intention (sig)
  - Intention -> Usage (sig)
  
  # Social Influence Process (Image is influenced by SN)
  - SubjectiveNorm -> Image (sig)

controls:
  - Experience
  - Voluntariness
